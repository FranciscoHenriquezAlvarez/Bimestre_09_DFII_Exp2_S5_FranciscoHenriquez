    />
    <title>MundoViajes | Agencia de Viajes</title>

    <!-- Recuperar las rutas directas al acceder desde GitHub Pages. -->
    <script>
      (function () {
        const clave = 'mundoviajes-ruta-pendiente';
        const rutaPendiente = sessionStorage.getItem(clave);

        if (!rutaPendiente) {
          return;
        }

        sessionStorage.removeItem(clave);

        const base = '/Bimestre_09_DFII_Exp2_S5_FranciscoHenriquez/';

        const rutaRestaurada =
          base + rutaPendiente.replace(/^\/+/, '');

        window.history.replaceState(
          null,
          '',
          rutaRestaurada
        );
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
